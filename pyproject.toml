[project]
name = "goit-cs-hw-04"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Guru01100101", email = "madness.monk93@gmail.com" }
]
requires-python = ">=3.14"
dependencies = []

[project.scripts]
goit-cs-hw-04 = "goit_cs_hw_04:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.17.0",
]

[tool.coverage.run]
source = ["."]
omit = ["tests/*", ".venv/*"]
branch = true
concurrency = ["thread", "multiprocessing"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_also = ['if __name__ == "__main__":']
